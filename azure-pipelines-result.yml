# Docker
# Build and push an image to Azure Container Registry
# https://docs.microsoft.com/azure/devops/pipelines/languages/docker

trigger:
  paths:
    include:
      - result/*

resources:
- repo: self

variables:
  # Container registry service connection established during pipeline creation
  dockerRegistryServiceConnection: '422ab91e-b5ee-4677-9537-5b5aafeb403f'
  imageRepository: 'resultservice'
  containerRegistry: 'rahulazurecicd.azurecr.io'
  dockerfilePath: '$(Build.SourcesDirectory)/result/Dockerfile'
  tag: '$(Build.BuildId)'

  # Agent VM image name
  vmImageName: 'ubuntu-latest'

stages:
- stage: Build
  displayName: Build and push stage
  jobs:
  - job: Build
    displayName: Build
    pool:
      vmImage: $(vmImageName)
    steps:
    - task: Docker@2
      displayName: Build and push an image to container registry
      inputs:
        containerRegistry: '$(dockerRegistryServiceConnection)'
        repository: '$(imageRepository)'
        command: 'buildAndPush'
        Dockerfile: 'result/Dockerfile'
        tags: '$(tag)'
- stage: Update 
  displayName: Update 
  jobs:
  - job: Update
    displayName: Update 
    pool:
      vmImage: $(vmImageName)
    steps:
      - script: sed -i 's/\r$//' scripts/updateK8sManifests.sh
        displayName: Convert script to LF
      - task: ShellScript@2
        displayName: Update
        inputs:
          scriptPath: 'scripts/updateK8sManifests.sh'
          args: 'result $(containerRegistry) $(imageRepository) $(tag)'
        env:
          SYSTEM_ACCESSTOKEN: $(System.AccessToken)
